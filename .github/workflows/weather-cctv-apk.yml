name: Weather CCTV test APK
on:
  workflow_dispatch:
  push:
    branches: [feature/weather-cctv]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Build isolated test APK
        run: cd launcher && chmod +x gradlew && ./gradlew assembleDebug -PlauncherApplicationId=com.rizpram.tvhome.dev --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-weather-cctv-test
          path: launcher/app/build/outputs/apk/debug/*.apk
